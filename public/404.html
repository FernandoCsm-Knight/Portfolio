<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/images/flogo.png" />
    <meta name="theme-color" content="#0b3350" />
    <title>404 · Fernando Dal' Maria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --texto: #e8f2f2;
        --texto-2: #9db8c4;
        --aqua: #38bde3;
        --aco: #aeb5b7;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 12vh 24px 10vh;
        text-align: center;
        font-family: 'Roboto', system-ui, sans-serif;
        color: var(--texto);
        background:
          radial-gradient(120% 80% at 50% 0%, #0f4064 0%, #0b3350 42%, #041a2c 100%),
          #0b3350;
        background-attachment: fixed;
      }
      .codigo {
        font-family: 'Roboto', sans-serif;
        font-weight: 700;
        font-size: clamp(64px, 18vw, 140px);
        line-height: 0.9;
        letter-spacing: 0.2em;
        color: transparent;
        -webkit-text-stroke: 1px rgba(56, 189, 227, 0.5);
      }
      h1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-weight: 700;
        font-size: clamp(24px, 5vw, 40px);
      }
      p {
        max-width: 46ch;
        font-size: 13px;
        line-height: 1.7;
        color: var(--texto-2);
      }
      p .en { display: block; margin-top: 6px; color: rgba(157, 184, 196, 0.7); }
      a.voltar {
        margin-top: 10px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-decoration: none;
        color: var(--aqua);
        border: 1px solid rgba(56, 189, 227, 0.38);
        background: rgba(4, 16, 26, 0.68);
        border-radius: 99px;
        padding: 12px 18px;
        transition: color 0.25s, border-color 0.25s;
      }
      a.voltar:hover {
        color: var(--aco);
        border-color: rgba(174, 181, 183, 0.55);
      }
    </style>
  </head>
  <body>
    <p class="codigo">404</p>
    <h1>Você nadou longe demais</h1>
    <p>
      Esta corrente não leva a lugar nenhum. A página que você procura não existe ou mudou de nome.
      <span class="en">This page doesn't exist or has been renamed.</span>
    </p>
    <a class="voltar" href="/">VOLTAR À SUPERFÍCIE</a>
  </body>
</html>
